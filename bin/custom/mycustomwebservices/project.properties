# Used to specify the list of API endpoint identifiers that must be disabled (example: getCatalogs,getBaseSites)
# The endpoint identifier is represented by the "nickname" attribute of the ApiOperation annotation used on an endpoint method
#mycustomwebservices.api.restrictions.disabled.endpoints=

# Used to enable legacy content negotiation approach, which assumes that:
# - useRegisteredSuffixPatternMatch() is set to true
# - response format can be changed with the HTTP request 'format' parameter
mycustomwebservices.content.negotiation.legacy=false

#mycustomwebservices
# Used to limit the maximum file size for file uploading using MultipartResolver
mycustomwebservices.core.v2.config.webconfig.MultipartResolver.maxUploadSize=10485760

# Used to deactivate the endpoints
mycustomwebservices.api.restrictions.disabled.endpoints=getAccessCodePublicKey,updateBillingAddress,createCartGuestUser,updateCurrentUserProfile,getCartIdAccessCode,paymentAuthorizedOrderPlacement,getUserOrderAttachments,getUserOrderAttachmentBinary,updateSapPaymentOption

# Configuration toggles
# When enabled, main product populators will be selectively invoked based on the fields parameter when retrieves the details of a single product using the product identifier by OCC API.
# Since 2211.20
toggle.occ.retrieving.product.performance.improvement.enabled=true
# Add toggle to fix the bug that should enable the hook while cloning a saved cart.
toggle.savecartcontroller.clonesavedcart.hook.enabled=false

# Add toggle to enable leveraging the X-FORWARDED-FOR header first before falling back to RemoteAddr.
toggle.useXForwardedForForIp.enabled=false

# Used to activate optimistic lock in the add to cart endpoints
mycustomwebservices.api.addToCartInOptimisticLockMode=false

